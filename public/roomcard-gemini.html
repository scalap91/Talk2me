<!doctype html><html lang=fr><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel=stylesheet></head><body style=margin:0><div style="background-color: #F5F6F8; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;">

      <div style="position: absolute; top: 12px; left: 12px; background-color: rgba(47,52,58,0.5); color: #FFFFFF; padding: 6px 10px; border-radius: 8px; font-size: 13px; font-weight: 500; backdrop-filter: blur(5px);">
        🚪 Salle 3D
      </div>
      <div style="position: absolute; bottom: 12px; right: 12px; background-color: #7C5CFF; color: #FFFFFF; padding: 6px 10px; border-radius: 18px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 4px;">
        <span style="font-size: 16px;">✨</span> Léa
      </div>
    </div>
    <div style="padding: 16px;">
      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">

        <div>
          <h3 style="font-family: 'Outfit', sans-serif; font-size: 18px; color: #2F343A; margin: 0;">Nom de l'Owner</h3>
          <p style="font-size: 13px; color: #6A7585; margin: 2px 0 0;">4 vidéos au mur · playlist</p>
        </div>
      </div>
      <button style="width: 100%; background-color: #FF7F11; color: #FFFFFF; border: none; padding: 14px 20px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 20px; box-shadow: 0 8px 20px rgba(255,127,17,.35);">
        🚪 Entrer dans ma salle
      </button>
      <div style="display: flex; justify-content: space-around; font-size: 14px; color: #6A7585;">

      </div>
